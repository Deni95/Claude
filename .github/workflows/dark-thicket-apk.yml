name: Тёмная Чаща — Android APK

on:
  push:
    paths:
      - 'dark-thicket/**'
      - '.github/workflows/dark-thicket-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dark-thicket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: ./scripts/patch-android.sh
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: dark-thicket/android
      - uses: actions/upload-artifact@v4
        with:
          name: dark-thicket-apk
          path: dark-thicket/android/app/build/outputs/apk/debug/app-debug.apk
